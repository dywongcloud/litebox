#
# Points every guest resolver (busybox's included -- ping, wget, nslookup, ...) at the in-guest
# DNS responder litebox_runner_linux_on_macos_userland::net_proxy::serve_dns binds on the guest
# loopback when the runner is started with --net-proxy. Real hostname resolution over the host's
# actual network; nothing else about raw IP networking works here (see serve_dns's doc comment).
# Without --net-proxy nothing answers on 127.0.0.1:53 and lookups simply time out, same as an
# unreachable real nameserver.
nameserver 127.0.0.1
