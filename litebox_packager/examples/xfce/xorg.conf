Section "Module"
    Disable "glx"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection

Section "Device"
    Identifier "fb"
    Driver "fbdev"
    # litebox's shadow-damage copy path is not implemented yet; direct fbdev
    # writes are the proven path to the browser framebuffer.
    Option "ShadowFB" "false"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device "fb"
EndSection

Section "InputDevice"
    Identifier "kbd"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
EndSection

Section "InputDevice"
    Identifier "mouse"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    # This device reports ABS_X/ABS_Y with no relative axes, so xf86-input-evdev
    # auto-classifies it as a touchscreen and, for that class, defaults
    # EmulateWheelButton to button 4 -- turning held-button-4 motion into
    # synthetic wheel events instead of passing it through. Our REL_WHEEL axis
    # already reports real wheel steps (see litebox's evdev emulation), so
    # wheel-button emulation is both redundant and a source of dropped/altered
    # button semantics for this virtual device; disable it explicitly.
    Option "EmulateWheel" "false"
    Option "EmulateWheelButton" "0"
EndSection

Section "ServerLayout"
    Identifier "layout"
    Screen "screen"
    InputDevice "kbd" "CoreKeyboard"
    InputDevice "mouse" "CorePointer"
EndSection
