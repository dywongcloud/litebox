[package]
name = "boxer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.33", features = ["derive"] }
litebox_syscall_rewriter = { version = "0.1.0", path = "../litebox_syscall_rewriter" }
litebox_packager = { version = "0.1.0", path = "../litebox_packager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

# Image acquisition (registry pulls, layer decompression) is available on the
# same hosts as litebox_packager's OCI support; see that crate's Cargo.toml for
# the native-tls constraint that shapes this cfg.
[target.'cfg(any(target_arch = "x86_64", all(target_arch = "aarch64", target_vendor = "apple")))'.dependencies]
flate2 = "1.1"
oci-spec = { version = "0.9", features = ["image"] }
ruzstd = "0.8"
tempfile = "3"
walkdir = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# In-process execution of built boxes uses the Linux userland runner, which is
# itself x86_64-linux-only today.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
litebox_runner_linux_userland = { version = "0.1.0", path = "../litebox_runner_linux_userland" }

[lints]
workspace = true
